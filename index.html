<!DOCTYPE html>
<html>
<head>
    <title>Darshan Mali | Data Analyst Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
        }

        .container {
            margin-top: 80px;
            padding: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        h2 {
            font-weight: normal;
            color: #cfd8dc;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            margin: 20px auto;
            width: 320px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        a {
            text-decoration: none;
            color: white;
            font-size: 18px;
            display: block;
        }

        .btn {
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
            background-color: #00bcd4;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #00acc1;
        }

        .btn.github { background-color: #4caf50; }
        .btn.github:hover { background-color: #43a047; }

        .btn.linkedin { background-color: #0e76a8; }
        .btn.linkedin:hover { background-color: #0b5f87; }

        footer {
            margin-top: 80px;
            color: #b0bec5;
            font-size: 14px;
        }

        /* Mobile responsiveness */
        @media(max-width: 480px){
            h1 { font-size: 34px; }
            .card { width: 90%; }
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Darshan Mali</h1>
    <h2>Data Analyst | SQL • Python • Excel • EDA</h2>

    <!-- Resume -->
    <div class="card">
        <a href="darshan_resume.pdf" target="_blank" class="btn">
            📄 View My Resume
        </a>
    </div>

    <!-- GitHub -->
    <div class="card">
        <a href="https://github.com/darshanmali99" target="_blank" class="btn github">
            💻 GitHub Projects
        </a>
    </div>

    <!-- LinkedIn -->
    <div class="card">
        <a href="https://www.linkedin.com/in/darshan-mali99" target="_blank" class="btn linkedin">
            🔗 LinkedIn Profile
        </a>
    </div>
</div>

<footer>
    © 2026 Darshan Mali • Data Analyst Portfolio
</footer>

</body>
</html>
